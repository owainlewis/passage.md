name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact full main commit SHA approved for production
        required: true
        type: string
      stripe_billing_mode:
        description: Preserve, update the monthly price, enable from repository variables, or fully disable live Stripe billing
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - update-price
          - enable
          - disable

permissions:
  contents: read

env:
  GCP_PROJECT_ID: passage-md-prod
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: passage-md
  CLOUD_RUN_MIGRATION_JOB: passage-md-migrate
  CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: passage-md-run@passage-md-prod.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: passage-md-prod:us-central1:passage-md-postgres
  CLOUD_RUN_MAX_INSTANCES: 4
  DATABASE_MAX_CONNS: 3
  PUBLIC_SIGNUP_ENABLED: 'true'
  PRO_MAX_SAVED_DOCS: '2000'
  DATABASE_SECRET: passage-database-url
  ARTIFACT_REGISTRY_REPOSITORY: passage-md
  IMAGE_NAME: passage-md
  APP_BASE_URL: https://passage.md
  RESEND_FROM: passage.md <mail@passage.md>
  STRIPE_MONTHLY_PRICE_ID: price_1TzDrwRaE2nmr5cQ5JwLldXH
  WORKLOAD_IDENTITY_PROVIDER: projects/311711068171/locations/global/workloadIdentityPools/github/providers/passage-md
  DEPLOY_SERVICE_ACCOUNT: passage-md-build@passage-md-prod.iam.gserviceaccount.com

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:web

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PASSAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/passage_test?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: passage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d passage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o /tmp/passage ./cmd/passage

  deployment-request:
    name: Validate production deployment request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Match the approved main commit
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production deployments must be dispatched from main." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ || "${RELEASE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "The approved release SHA does not match the dispatched main commit." >&2
            exit 1
          fi

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, server]
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Test production deployment gate
        run: scripts/deploy-production.test.sh

      - name: Test CI production deployment gate
        run: bash scripts/ci-production-deployment-gate.test.sh

      - name: Test production community operation gate
        run: scripts/run-production-community-op.test.sh

      - name: Test production Checkout diagnostics
        run: scripts/query-production-checkout-errors.test.sh

      - name: Test monitoring configuration
        run: ops/monitoring/validate.test.sh

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: ${{ github.event_name == 'workflow_dispatch' }}
          push: false
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:main

      - name: Export the proven production image
        if: github.event_name == 'workflow_dispatch'
        run: >-
          docker save
          --output "${RUNNER_TEMP}/passage-production-image.tar"
          "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Retain the proven production image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passage-production-image-${{ github.sha }}
          path: ${{ runner.temp }}/passage-production-image.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Production deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [web, server, deployment-request, container]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the proven production image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: passage-production-image-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load the proven production image
        run: docker load --input "${RUNNER_TEMP}/passage-production-image.tar"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify production readiness metadata
        run: |
          set -euo pipefail
          cloud_sql_instance="${CLOUD_SQL_INSTANCE##*:}"
          latest_backup="$(
            gcloud sql backups list \
              --instance="${cloud_sql_instance}" \
              --project="${GCP_PROJECT_ID}" \
              --filter='type=AUTOMATED AND status=SUCCESSFUL' \
              --sort-by='~endTime' \
              --limit=1 \
              --format=json
          )"
          if ! jq -e '
            if length != 1 then false
            else
              (.[0].endTime | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) as $end
              | now >= $end and (now - $end) <= 86400
            end
          ' <<<"${latest_backup}" >/dev/null; then
            echo "No successful automated backup completed within the last 24 hours." >&2
            exit 1
          fi
          jq -r '.[0] | "backup id=\(.id) status=\(.status) end=\(.endTime) location=\(.location)"' <<<"${latest_backup}"

          service="$(
            gcloud run services describe "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format=json
          )"
          if ! jq -e '
            (.status.traffic // []) as $traffic
            | [$traffic[] | select((.percent // 0) > 0)] as $serving
            | (($serving | length) == 1
              and $serving[0].percent == 100
              and (($serving[0].revisionName // "") | length) > 0)
          ' <<<"${service}" >/dev/null; then
            echo "Production is not routing 100 percent to one explicit revision." >&2
            exit 1
          fi
          jq -r '.status.traffic[] | select(.percent == 100) | "current revision=\(.revisionName) traffic=100"' <<<"${service}"

          health="$(curl --fail-with-body --silent --show-error "${APP_BASE_URL}/api/health")"
          jq -e '.database == "ok" and .status == "ok"' <<<"${health}" >/dev/null
          jq '{database, status}' <<<"${health}"

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Push the proven production image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          MAIN_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:main
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE}" >/dev/null
          docker push "${IMAGE}"
          docker tag "${IMAGE}" "${MAIN_IMAGE}"
          docker push "${MAIN_IMAGE}"

      - name: Migrate and deploy to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          PUBLIC_SIGNUP_ENABLED: ${{ env.PUBLIC_SIGNUP_ENABLED }}
          PRO_MAX_SAVED_DOCS: ${{ env.PRO_MAX_SAVED_DOCS }}
          STRIPE_BILLING_MODE: ${{ inputs.stripe_billing_mode }}
          STRIPE_MONTHLY_PRICE_ID: ${{ env.STRIPE_MONTHLY_PRICE_ID }}
          STRIPE_SECRET_KEY_SECRET: ${{ vars.STRIPE_SECRET_KEY_SECRET }}
          STRIPE_SECRET_KEY_VERSION: ${{ vars.STRIPE_SECRET_KEY_VERSION }}
          STRIPE_WEBHOOK_SECRET_SECRET: ${{ vars.STRIPE_WEBHOOK_SECRET_SECRET }}
          STRIPE_WEBHOOK_SECRET_VERSION: ${{ vars.STRIPE_WEBHOOK_SECRET_VERSION }}
        run: scripts/deploy-production.sh
