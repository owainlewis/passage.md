name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stripe_billing_mode:
        description: Preserve, enable, or disable live Stripe billing
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - enable
          - disable

permissions:
  contents: read

env:
  GCP_PROJECT_ID: passage-md-prod
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: passage-md
  CLOUD_RUN_MIGRATION_JOB: passage-md-migrate
  CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: passage-md-run@passage-md-prod.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: passage-md-prod:us-central1:passage-md-postgres
  CLOUD_RUN_MAX_INSTANCES: 4
  DATABASE_MAX_CONNS: 3
  PUBLIC_SIGNUP_ENABLED: 'false'
  STRIPE_MONTHLY_PRICE_ID: price_1TxulyLIRVH1hzohfJBV5lRz
  STRIPE_SECRET_KEY_SECRET: passage-stripe-secret-key
  STRIPE_SECRET_KEY_VERSION: '1'
  STRIPE_WEBHOOK_SECRET_SECRET: passage-stripe-webhook-secret
  STRIPE_WEBHOOK_SECRET_VERSION: '1'
  DATABASE_SECRET: passage-database-url
  ARTIFACT_REGISTRY_REPOSITORY: passage-md
  IMAGE_NAME: passage-md
  APP_BASE_URL: https://passage.md
  RESEND_FROM: passage.md <mail@passage.md>
  WORKLOAD_IDENTITY_PROVIDER: projects/311711068171/locations/global/workloadIdentityPools/github/providers/passage-md
  DEPLOY_SERVICE_ACCOUNT: passage-md-build@passage-md-prod.iam.gserviceaccount.com

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:web

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PASSAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/passage_test?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: passage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d passage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o /tmp/passage ./cmd/passage

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, server]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry auth
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Test production deployment gate
        run: scripts/deploy-production.test.sh

      - name: Test production community operation gate
        run: scripts/run-production-community-op.test.sh

      - name: Test production Checkout diagnostics
        run: scripts/query-production-checkout-errors.test.sh

      - name: Test monitoring configuration
        run: ops/monitoring/validate.test.sh

      - name: Build and maybe push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:main

      - name: Migrate and deploy to Cloud Run
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          PUBLIC_SIGNUP_ENABLED: ${{ env.PUBLIC_SIGNUP_ENABLED }}
          STRIPE_BILLING_MODE: ${{ inputs.stripe_billing_mode || 'preserve' }}
          STRIPE_MONTHLY_PRICE_ID: ${{ env.STRIPE_MONTHLY_PRICE_ID }}
          STRIPE_SECRET_KEY_SECRET: ${{ env.STRIPE_SECRET_KEY_SECRET }}
          STRIPE_SECRET_KEY_VERSION: ${{ env.STRIPE_SECRET_KEY_VERSION }}
          STRIPE_WEBHOOK_SECRET_SECRET: ${{ env.STRIPE_WEBHOOK_SECRET_SECRET }}
          STRIPE_WEBHOOK_SECRET_VERSION: ${{ env.STRIPE_WEBHOOK_SECRET_VERSION }}
        run: scripts/deploy-production.sh
